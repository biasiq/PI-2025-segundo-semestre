<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro Matéria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles_cadastro_materia.css" />
</head>

<body>
    <main>
        <header>
            <div class="topo">
                <div class="cadastro-materia">
                    <h1>Cadastro de matérias</h1>
                </div>
            </div>
        </header>

        <div class="parte-azul-clara">
            <section class="container-sm">

                <div class="mb-3">
                    <label class="form-label">Tipo de cadastro:</label>
                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="tipoMateria" id="radio-existente" value="existente" />
                            <label class="form-check-label" for="radio-existente">Matéria existente</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="tipoMateria" id="radio-nova" value="nova" checked />
                            <label class="form-check-label" for="radio-nova">Nova matéria</label>
                        </div>
                    </div>
                </div>

                <div id="existing-materia-block" class="mb-3" style="display: none;">
                    <label for="select-existing-materia" class="form-label">Escolha a matéria</label>
                    <select id="select-existing-materia" class="form-select">
                        <option value="">Carregando matérias...</option>
                    </select>
                    <div class="invalid-feedback">Selecione uma matéria válida.</div>
                </div>

                <div id="new-materia-block" class="form-floating p-2">
                    <textarea class="form-control" id="nome-materia"></textarea>
                    <label for="nome-materia">Nome da nova matéria</label>
                    <div class="invalid-feedback">A matéria deve ter ao menos 3 caracteres.</div>
                </div>

                <!-- <div id="assunto-block" class="form-floating p-2">
                    <textarea class="form-control" id="nome-assunto"></textarea>
                    <label for="nome-assunto">Nome do assunto</label>
                    <div class="invalid-feedback">O assunto deve ter ao menos 3 caracteres.</div>
                </div> -->

                <div id="assunto-block" class="mb-3">
                        <label for="nome" class="form-label">Digite o nome do assunto:
                        </label>
                        <input type="textarea" class="form-control" id="nome-assunto" required>
                        <div class="invalid-feedback">O assunto deve ter ao menos 3 caracteres.</div>
                    </div>



                <div class="botao">
                    <button type="button" class="btn btn-primary btn-lg" id="botao-cadastrar">Cadastrar</button>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p class="position-relative position-absolute bottom-0 start-50 translate-middle-x">
            © Todos os direitos reservados - 2025
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/cadastro_materia.js"></script>
</body>
</html>
